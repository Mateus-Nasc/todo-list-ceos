<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/task.css">
</head>
<body>
 
  <!-- Header -->
  <header>
    <span class="logo">Flow</span>
    <div class="line"></div>
    <span class="logo-sub">Organize o Fluxo De Suas Tarefas</span>
  </header>
 
  <main>
 
    <!-- Introdução -->
    <div class="top-bar">
      <p>Olá, <span id="nome-usuario">...</span></p>
      <div class="search">
        <input type="text" id="input-busca" placeholder="Buscar">
      </div>
    </div>
    <img src="img/Group.png" alt="Homem com suas tarefas" class="image">
 
    <div class="board" id="board">
 
      <!-- espacinho pra tarefa dentro dessa diva -->
 
      <!-- Botão para criar nova tarefa -->
      <button class="btn-nova-lista" id="btn-add">
        <div class="plus">+</div>
        Nova Tarefa
      </button>
 
    </div>
  </main>
 <script src="main.js"></script>
</body>
</html>
